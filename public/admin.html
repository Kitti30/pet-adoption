<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ผู้ดูแลระบบ | บ้านใหม่ให้น้อง</title><link rel="stylesheet" href="/css/style.css"></head><body>
<section class="blk"><div class="wrap"><h2>ระบบผู้ดูแล</h2><div class="stats" id="st"></div>
<div class="tabs"><button class="tab on" data-t="pets">ประกาศสัตว์</button><button class="tab" data-t="users">ผู้ใช้งาน</button><button class="tab" data-t="reqs">คำขอทั้งหมด</button></div>
<div class="scroll" id="box"></div></div></section>
<script src="/js/app.js"></script><script>
(async()=>{if(!await initPage({admin:true}))return;
const box=$('#box'),D=d=>new Date(d).toLocaleDateString('th-TH');
async function stats(){const s=await api('/api/admin/stats');
$('#st').innerHTML=[['ผู้ใช้ทั้งหมด',s.users],['ประกาศรออนุมัติ',s.pets_pending],['กำลังหาบ้าน',s.pets_available],['ได้บ้านแล้ว',s.pets_adopted],['คำขอรอพิจารณา',s.requests_pending]].map(([l,n])=>`<div class="stat"><b>${n}</b>${l}</div>`).join('')}
const views={
async pets(){const {pets}=await api('/api/admin/pets');
 box.innerHTML='<table><tr><th>ชื่อ</th><th>ชนิด</th><th>ผู้ลง</th><th>สถานะ</th><th>จัดการ</th></tr>'+pets.map(p=>`<tr><td><a href="/pet.html?id=${p.id}"><b>${esc(p.name)}</b></a></td><td>${SPECIES[p.species]}</td><td>${esc(p.owner_name)}</td><td><span class="badge b-${p.status}">${PET_ST[p.status]}</span></td>
 <td>${p.status==='pending'||p.status==='hidden'?`<button class="btn sm teal" data-s="available" data-id="${p.id}">อนุมัติ</button> `:''}${p.status!=='hidden'?`<button class="btn sm ghost" data-s="hidden" data-id="${p.id}">ซ่อน</button> `:''}<button class="btn sm ghost" data-del="${p.id}">ลบ</button></td></tr>`).join('')+'</table>';
 $$('[data-s]').forEach(b=>b.onclick=async()=>{await api('/api/admin/pets/'+b.dataset.id,{method:'PATCH',body:{status:b.dataset.s}});stats();views.pets()});
 $$('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('ลบประกาศนี้ถาวร?'))return;await api('/api/pets/'+b.dataset.del,{method:'DELETE'});stats();views.pets()})},
async users(){const {users}=await api('/api/admin/users');
 box.innerHTML='<table><tr><th>ชื่อ</th><th>อีเมล</th><th>เบอร์</th><th>จังหวัด</th><th>สถานะ</th><th>ยืนยันตัวตน</th><th>จัดการ</th></tr>'+users.map(u=>`<tr><td>${esc(u.name)} ${u.role==='admin'?'👑':''}</td><td>${esc(u.email)}</td><td>${esc(u.phone||'-')}</td><td>${esc(u.province||'-')}</td>
 <td><span class="badge b-${u.status==='banned'?'banned':'available'}">${u.status==='banned'?'ถูกระงับ':'ปกติ'}</span></td><td>${u.verified?'✅':'-'}</td>
 <td>${u.role==='admin'?'':`<button class="btn sm ghost" data-v="${u.id}" data-val="${!u.verified}">${u.verified?'ยกเลิกยืนยัน':'ยืนยันตัวตน'}</button> <button class="btn sm ghost" data-b="${u.id}" data-val="${u.status==='banned'?'active':'banned'}">${u.status==='banned'?'ปลดระงับ':'ระงับ'}</button>`}</td></tr>`).join('')+'</table>';
 $$('[data-v]').forEach(b=>b.onclick=async()=>{await api('/api/admin/users/'+b.dataset.v,{method:'PATCH',body:{verified:b.dataset.val==='true'}});views.users()});
 $$('[data-b]').forEach(b=>b.onclick=async()=>{await api('/api/admin/users/'+b.dataset.b,{method:'PATCH',body:{status:b.dataset.val}});views.users()})},
async reqs(){const {requests}=await api('/api/admin/requests');
 box.innerHTML='<table><tr><th>สัตว์</th><th>ผู้ขอ</th><th>คะแนน</th><th>สถานะ</th><th>วันที่</th></tr>'+requests.map(r=>`<tr><td>${esc(r.pet_name)}</td><td>${esc(r.applicant_name)}</td><td>${r.score}</td><td><span class="badge b-${r.status}">${REQ_ST[r.status]}</span></td><td>${D(r.created_at)}</td></tr>`).join('')+'</table>'}};
$$('.tab').forEach(t=>t.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');views[t.dataset.t]().catch(x=>toast(x.message,1))});
stats();views.pets();})();
</script></body></html>
