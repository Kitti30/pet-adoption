<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ค้นหาสัตว์ | บ้านใหม่ให้น้อง</title><link rel="stylesheet" href="/css/style.css"></head><body>
<section class="blk"><div class="wrap"><h2>ค้นหาสัตว์ที่รอบ้าน</h2>
<form class="filters" id="flt">
<label>ชนิด<select name="species"><option value="">ทั้งหมด</option><option value="dog">สุนัข</option><option value="cat">แมว</option><option value="rabbit">กระต่าย</option><option value="bird">นก</option><option value="other">อื่น ๆ</option></select></label>
<label>สายพันธุ์<input name="breed" placeholder="เช่น ไทยหลังอาน"></label>
<label>อายุ<select name="age"><option value="">ทุกวัย</option><option value="baby">ต่ำกว่า 1 ปี</option><option value="young">1–2 ปี</option><option value="adult">3–7 ปี</option><option value="senior">8 ปีขึ้นไป</option></select></label>
<label>พื้นที่ (จังหวัด)<input name="province" placeholder="เช่น กรุงเทพ"></label>
<label>คำค้น<input name="q" placeholder="ชื่อ/ลักษณะ"></label>
<button class="btn teal">ค้นหา</button></form>
<div class="grid" id="list"></div></div></section>
<script src="/js/app.js"></script><script>
(async()=>{await initPage();
const f=$('#flt'),qs=new URLSearchParams(location.search);
[...f.elements].forEach(e=>{if(e.name&&qs.get(e.name))e.value=qs.get(e.name)});
async function load(){const p=new URLSearchParams();[...f.elements].forEach(e=>{if(e.name&&e.value)p.set(e.name,e.value)});
history.replaceState(null,'','?'+p);
const {pets}=await api('/api/pets?'+p);
$('#list').innerHTML=pets.length?pets.map(petCard).join(''):'<p class="empty" style="grid-column:1/-1">ไม่พบสัตว์ตามเงื่อนไข ลองเปลี่ยนตัวกรองดูนะ</p>';}
f.onsubmit=e=>{e.preventDefault();load()};load();})();
</script></body></html>
