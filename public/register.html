<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>สมัครสมาชิก | บ้านใหม่ให้น้อง</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div class="card pad narrow"><h2>สมัครสมาชิก</h2>
<form class="f" id="f"><label>ชื่อ-นามสกุล<input name="name" required></label>
<label>อีเมล<input type="email" name="email" required></label>
<label>รหัสผ่าน (อย่างน้อย 6 ตัว)<input type="password" name="password" minlength="6" required></label>
<div class="row"><label>เบอร์โทร<input name="phone"></label><label>จังหวัด<input name="province"></label></div>
<button class="btn teal">สมัครสมาชิก</button><p class="muted">มีบัญชีแล้ว? <a href="/login.html"><b>เข้าสู่ระบบ</b></a></p></form></div>
<script src="/js/app.js"></script><script>
(async()=>{await initPage();
$('#f').onsubmit=async e=>{e.preventDefault();
try{await api('/api/auth/register',{method:'POST',body:Object.fromEntries(new FormData(e.target))});location.href='/';}
catch(x){toast(x.message,1)}};})();
</script></body></html>
